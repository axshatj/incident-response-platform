name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven + JUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify (compile + tests)
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            services/incident-service/target/surefire-reports/
            services/agent-service/target/surefire-reports/
            services/ops-mcp-server/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: UI (TypeScript + Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

  docker:
    name: Docker (service image builds)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build incident-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/incident-service/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope:incident-service
          cache-to: type=gha,mode=max,scope:incident-service
          tags: irp/incident-service:ci

      - name: Build agent-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agent-service/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope:agent-service
          cache-to: type=gha,mode=max,scope:agent-service
          tags: irp/agent-service:ci

      - name: Build ops-mcp-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ops-mcp-server/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope:ops-mcp-server
          cache-to: type=gha,mode=max,scope:ops-mcp-server
          tags: irp/ops-mcp-server:ci
