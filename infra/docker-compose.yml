# Local dev stack.
# Usage (from the repo root):
#   docker compose -f infra/docker-compose.yml up --build
#
# Services (Phase 1 + Phase 2 + Phase 3):
#   postgres          - PostgreSQL 16
#   incident-service  - Spring Boot 3, exports OTLP + Prometheus metrics, :8080
#   otel-collector    - OpenTelemetry Collector (contrib), OTLP receiver, fan-out
#   jaeger            - all-in-one, OTLP-native, UI :16686
#   prometheus        - scrapes incident-service and the collector, UI :9090
#   grafana           - pre-provisioned Prometheus + Jaeger datasources + dashboard, UI :3000
#   kafka             - Kafka 3.7 in KRaft mode (no ZooKeeper), :9092 host / :29092 in-network
#   kafka-ui          - Provectus Kafka UI for topic/message inspection, :8090

name: irp

services:
  postgres:
    image: postgres:16-alpine
    container_name: irp-postgres
    environment:
      POSTGRES_DB: irp
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: irp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irp -d irp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: irp-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318"          # OTLP/HTTP (internal, exposed only inside compose network)
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: irp-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - jaeger
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
      - "8889:8889"   # Prometheus scrape target (metrics republished)
      - "8888:8888"   # Collector self-metrics
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: irp-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: irp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: irp-kafka
    environment:
      # KRaft (no ZooKeeper) single-node config
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: irp-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: irp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  incident-service:
    build:
      context: ..
      dockerfile: services/incident-service/Dockerfile
    container_name: irp-incident-service
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      IRP_DB_URL: jdbc:postgresql://postgres:5432/irp
      IRP_DB_USER: irp
      IRP_DB_PASSWORD: irp
      IRP_INCIDENT_PORT: 8080
      IRP_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      IRP_ENVIRONMENT: local
      IRP_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      IRP_KAFKA_BOOTSTRAP: kafka:29092
      IRP_KAFKA_GROUP: incident-service
      IRP_KAFKA_PARTITIONS: "3"
      IRP_KAFKA_REPLICAS: "1"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  kafka-data:
