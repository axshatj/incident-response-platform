global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: irp-local

scrape_configs:
  # Micrometer/Prometheus registry on the incident-service Actuator endpoint.
  - job_name: incident-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incident-service:8080"]
        labels:
          service: incident-service
          environment: local

  - job_name: ops-mcp-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ops-mcp-server:8082"]
        labels:
          service: ops-mcp-server
          environment: local

  # OTel Collector's Prometheus exporter (OTLP metrics republished).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector's own internal metrics.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
