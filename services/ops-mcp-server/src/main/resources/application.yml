spring:
  application:
    name: ops-mcp-server

server:
  port: ${IRP_MCP_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${IRP_ENVIRONMENT:local}
