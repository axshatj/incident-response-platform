spring:
  application:
    name: incident-service
  datasource:
    url: ${IRP_DB_URL:jdbc:postgresql://localhost:5432/irp}
    username: ${IRP_DB_USER:irp}
    password: ${IRP_DB_PASSWORD:irp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${IRP_INCIDENT_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${IRP_ENVIRONMENT:local}
  tracing:
    sampling:
      probability: ${IRP_TRACE_SAMPLE:1.0}
  otlp:
    tracing:
      # OTel Collector OTLP/HTTP receiver. When the collector is not reachable
      # the exporter logs a warning; the service still runs.
      endpoint: ${IRP_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  # logback-spring.xml switches between plain (local dev) and JSON (container).
  level:
    org.hibernate.SQL: INFO

irp:
  cors:
    allowed-origins: ${IRP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
