spring:
  application:
    name: incident-service
  datasource:
    url: ${IRP_DB_URL:jdbc:postgresql://localhost:5432/irp}
    username: ${IRP_DB_USER:irp}
    password: ${IRP_DB_PASSWORD:irp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${IRP_INCIDENT_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: INFO

irp:
  cors:
    allowed-origins: ${IRP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
